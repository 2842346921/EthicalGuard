[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethicalguard"
version = "0.1.0"
description = "EthicalGuard: 跨临床场景的伦理决策平衡与韧性评估框架（MANE 3.0 + Med-Ethical-Stress + MedEval）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
api = ["requests>=2.31"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
